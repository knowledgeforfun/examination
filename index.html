<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF → MCQ Quiz</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ac:#3b5bdb;--ok:#2b8a3e;--bad:#c92a2a;--bd:#e2e0d8}
@media(prefers-color-scheme:dark){:root{--bg:#17171a;--card:#222226;--tx:#ecebe6;--mu:#a09f98;--ac:#7c93ff;--ok:#69db7c;--bad:#ff8787;--bd:#34343a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Noto Sans Devanagari","Noto Sans Gujarati",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.mu{color:var(--mu);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;cursor:pointer}button:disabled{opacity:.5}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.drop{display:block;border:2px dashed var(--bd);border-radius:12px;padding:26px;text-align:center;cursor:pointer;color:var(--mu)}
input[type=number]{width:70px;font:inherit;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.fig{max-width:100%;border:1px solid var(--bd);border-radius:8px;background:#fff;margin:6px 0}
#log{font-size:13px;color:var(--mu);margin-top:6px;max-height:140px;overflow:auto}.err{color:var(--bad)}.hide{display:none}
</style></head><body><main>
<h1>📚 PDF → MCQ Quiz</h1>
<p class="mu">Book ka PDF (ya photos) daalo. Hindi, English aur ગુજરાતી ke question-answer se quiz apne aap ban jayega.</p>

<div class="card" id="up">
  <label class="drop" id="dl">📄 PDF ya photos chuno<input id="f" type="file" accept="application/pdf,image/*" multiple hidden></label>
  <div id="rg" class="row hide" style="margin-top:10px"><span class="mu" id="tot"></span>
    <span class="mu">Page <input type="number" id="p1" min="1" value="1"> se <input type="number" id="p2" min="1" value="1"> tak</span></div>
  <div class="row" style="margin-top:10px"><span class="mu">Mode</span><select id="md" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)"><option value="acc">Accurate (dheema, behtar answer)</option><option value="fast">Tez (kam accurate)</option></select></div>
  <div class="row" style="margin-top:10px"><span class="mu" id="st"></span><button id="go" disabled>Quiz banao</button></div>
  <div class="bar"><i id="pb"></i></div><div id="log"></div>
</div>
<div id="qz"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* >>> Worker deploy karne ke baad yahan apna URL paste karo <<< */
const PROXY='https://blue-field-2ba2.vveerv8.workers.dev';
const MAXPAGES=60;
const isFast=()=>$('md').value==='fast',MX=()=>isFast()?1250:1600;
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let pdf=null,imgs=[],Q=[],cur=0,score=0,done=false;

$('f').onchange=async e=>{
  pdf=null;imgs=[];$('log').replaceChildren();$('rg').classList.add('hide');
  const files=[...e.target.files];if(!files.length)return;
  try{
    const p=files.find(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));
    if(p){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      pdf=await pdfjsLib.getDocument({data:await p.arrayBuffer()}).promise;
      $('tot').textContent=`${p.name}: ${pdf.numPages} pages`;$('p1').max=$('p2').max=pdf.numPages;
      $('p1').value=1;$('p2').value=Math.min(pdf.numPages,20);$('rg').classList.remove('hide');
      $('st').textContent='Pages chuno (shuru me 10–20 pages se try karo).';
    }else{
      for(const f of files)imgs.push(await createImageBitmap(f));
      $('st').textContent=imgs.length+' photo(s) ready';
    }
    $('go').disabled=false;
  }catch(err){$('st').textContent='File khul nahi payi. Dusra PDF/photo try karo.';$('go').disabled=true}
};

async function pageCanvas(i){            // i: 0-based job index
  let src,w,h;
  if(pdf){const pg=await pdf.getPage(i);const v0=pg.getViewport({scale:1}),s=MX()/Math.max(v0.width,v0.height),v=pg.getViewport({scale:s});
    const c=document.createElement('canvas');c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;return c}
  src=imgs[i];w=src.width;h=src.height;const s=Math.min(1,MX()/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c;
}
async function ask(canvas,note){
  const image=canvas.toDataURL('image/jpeg',isFast()?.78:.88).split(',')[1];
  const fast=isFast();
  let last='';
  for(let t=0;t<5;t++){
    try{
      const r=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,fast})});
      const j=await r.json().catch(()=>({}));
      if(r.ok)return j.questions||[];
      last=j.error||('HTTP '+r.status);
      if(r.status===400||r.status===500)throw new Error(last);
    }catch(e){last=e.message||String(e);if(/GEMINI|image|bad/i.test(last))throw e;if(e instanceof TypeError&&t>=1)throw new Error('Worker URL galat hai ya internet nahi hai')}
    if(note)note(`dobara try ${t+1}/5 (${last})`);
    await sleep(2500*(t+1));            // free quota: ruk kar dobara
  }
  throw new Error(last||'server jawab nahi de raha');
}
function svgUrl(s){return typeof s==='string'&&/<svg[\s>]/i.test(s)?'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s):null}
function cropFig(c,b){
  if(!Array.isArray(b))return null;const [x,y,w,h]=b;if(w<30||h<30||w*h>380000||h>550)return null;const p=15;
  const X=Math.max(0,x-p)/1000*c.width,Y=Math.max(0,y-p)/1000*c.height,W=Math.min(c.width-X,(w+2*p)/1000*c.width),H=Math.min(c.height-Y,(h+2*p)/1000*c.height);
  if(W<20||H<20)return null;const o=document.createElement('canvas');o.width=W;o.height=H;o.getContext('2d').drawImage(c,X,Y,W,H,0,0,W,H);return o.toDataURL('image/jpeg',.9);
}
function shuffle(q){const idx=q.options.map((_,i)=>i).sort(()=>Math.random()-.5);return{...q,options:idx.map(i=>q.options[i]),answer:idx.indexOf(q.answer)}}
function log(t,bad){const d=el('div',bad?'err':'',t);$('log').append(d);$('log').scrollTop=1e9}

$('go').onclick=async()=>{
  if(!PROXY||PROXY.startsWith('PASTE')){$('st').textContent='Worker URL set nahi hai (index.html me PROXY line).';return}
  let from,to;if(pdf){from=Math.max(1,+$('p1').value||1);to=Math.min(pdf.numPages,+$('p2').value||from);if(to<from)to=from;if(to-from+1>MAXPAGES)to=from+MAXPAGES-1}
  else{from=0;to=imgs.length-1}
  const list=[];for(let i=from;i<=to;i++)list.push(i);
  $('go').disabled=true;$('qz').replaceChildren();$('log').replaceChildren();Q=[];
  const res=[];let next=0,fin=0,fail=0;const t0=Date.now();
  $('st').textContent=`Shuru ho gaya… 0/${list.length} pages (pehla page 20–40 second le sakta hai)`;$('pb').style.width='3%';
  const tick=setInterval(()=>{$('st').textContent=`${fin}/${list.length} pages ho gaye · ${Math.round((Date.now()-t0)/1000)} sec`},1000);
  async function worker(){
    while(true){const k=next++;if(k>=list.length)return;const i=list[k],label=pdf?'Page '+i:'Photo '+(i+1);
      try{
        log(`${label}: AI ko bhej raha hoon…`);const c=await pageCanvas(i),qs=await ask(c,m=>log(`${label}: ${m}`));
        res[k]=qs.map(q=>shuffle({...q,fig:svgUrl(q.fig)}));
        log(`${label}: ${qs.length} question`);
      }catch(e){fail++;log(`${label}: nahi hua (${e.message})`,true)}
      fin++;$('pb').style.width=Math.max(3,fin/list.length*100)+'%';
    }
  }
  await Promise.all([worker(),worker(),worker()]);clearInterval(tick);
  res.forEach(a=>a&&Q.push(...a));
  $('go').disabled=false;
  if(!Q.length){$('st').textContent=fail?'Koi quiz nahi bana. Neeche error dekho.':'In pages me question nahi mile. Dusre pages try karo.';return}
  $('st').textContent=`${Q.length} questions ready`+(fail?` (${fail} page fail — dobara try kar sakte ho)`:'');
  cur=0;score=0;show();$('qz').scrollIntoView({behavior:'smooth'});
};

function show(){
  const root=$('qz');root.replaceChildren();done=false;
  if(cur>=Q.length){const d=el('div','card');d.append(el('h2',0,`Score: ${score} / ${Q.length}`));
    const b=el('button',0,'Dobara khelo'),n=el('button','g','Naya PDF');b.onclick=()=>{Q.sort(()=>Math.random()-.5);cur=0;score=0;show()};n.onclick=()=>location.reload();
    d.append(b,' ',n);root.append(d);return}
  const q=Q[cur],d=el('div','card'),r=el('div','row');
  r.append(el('span','mu',`Question ${cur+1} / ${Q.length}`),el('span','mu','Score '+score));
  const bar=el('div','bar');bar.innerHTML='<i></i>';bar.firstChild.style.width=(cur/Q.length*100)+'%';
  d.append(r,bar,el('h3',0,q.q));
  if(q.guess)d.append(el('div','mu','⚠ Is page par answer nahi tha, AI ne andaza lagaya hai.'));
  if(q.fig){const im=new Image();im.src=q.fig;im.className='fig';const hb=el('button','g','Figure galat hai? Hatao');hb.style.fontSize='13px';hb.onclick=()=>{im.remove();hb.remove();q.fig=null};d.append(im,hb)}
  q.options.forEach((o,i)=>{const b=el('button','opt',o);b.onclick=()=>{
    if(done)return;done=true;const ok=i===q.answer;if(ok)score++;b.classList.add(ok?'ok':'bad');
    d.querySelectorAll('.opt')[q.answer].classList.add('ok');
    const n=el('button',0,cur+1<Q.length?'Next →':'Result');n.style.marginTop='10px';n.onclick=()=>{cur++;show()};d.append(n)};d.append(b)});
  root.append(d);
}
</script></body></html>
